# Temporary HTTP-only vhost used once, so certbot can answer the ACME
# http-01 challenge before the real TLS config references a certificate.
server {
    listen 80;
    listen [::]:80;
    server_name crm.twixrsolutions.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
