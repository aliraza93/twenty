# Production deploy: build the Twenty image on GitHub, push to GHCR,
# then roll it onto the droplet over SSH.
#
# Required repository secrets:
#   SSH_PRIVATE_KEY — private key for the deploy user (PEM, dedicated deploy key).
#   SSH_HOST        — droplet IP (134.199.177.66).
#
# Optional repository variables:
#   SSH_USER        — SSH login (default: deploy).
#   DEPLOY_PATH     — remote app root (default: /opt/twenty).
#
# The droplet must already have been provisioned with deploy/bootstrap-server.sh.

name: Deploy production

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'packages/twenty-website/**'
      - 'packages/twenty-docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Twenty image build needs well over the ~14 GB a runner starts with.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          REPO_LC="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          SHA_TAG="${REGISTRY}/${REPO_LC}:sha-${GITHUB_SHA::7}"
          {
            echo "image=${SHA_TAG}"
            echo "tags=${SHA_TAG},${REGISTRY}/${REPO_LC}:latest"
            echo "version=$(node -p "require('./package.json').version")"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/twenty-docker/twenty/Dockerfile
          target: twenty
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -t ed25519,rsa "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync deploy assets
        env:
          HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          U="${SSH_USER:-deploy}"
          P="${DEPLOY_PATH:-/opt/twenty}"
          SSH_OPTS="-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=6"
          # .env holds the live secrets and is owned by the server, never by CI.
          rsync -az -e "ssh ${SSH_OPTS}" \
            --exclude='.env' \
            ./deploy/ "${U}@${HOST}:${P}/"

      - name: Roll out new image
        env:
          HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          U="${SSH_USER:-deploy}"
          P="${DEPLOY_PATH:-/opt/twenty}"
          SSH_OPTS="-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=6"
          ssh ${SSH_OPTS} "${U}@${HOST}" \
            "APP_DIR='${P}' bash '${P}/deploy.sh' '${IMAGE}'"

      - name: Verify public endpoint
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://crm.twixrsolutions.com/healthz || true)
            if [ "$code" = "200" ]; then
              echo "crm.twixrsolutions.com is healthy"
              exit 0
            fi
            echo "attempt ${attempt}: got HTTP ${code}, retrying in 10s"
            sleep 10
          done
          echo "Public health check failed."
          exit 1
